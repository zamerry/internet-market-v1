<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="client.data.js" type="module" defer></script>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

        </div>
        <div class="header__payment">

            <div class="header__login">Войти</div>
        </div>

    <div class="main__inner">
        <div class="main__tabs">
            <div class="main__tab" id="category_electronics">Электроника</div>
            <div class="main__tab" id="category_clothes">Одежда</div>

        <div class="main__table">
            <!--<div class="main__table_cards"></div>-->

<footer class="footer">
    <div class="footer__inner">
        <p>
            <a href="https://github.com/zamerry">https://github.com/zamerry</a>
